[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adv-archon"
version = "0.1.0"
description = "ADV ARCHON: local-first terminal assistant for Pablo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Pablo Alcocer" }
]
dependencies = [
  "dateparser>=1.2.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",
  "passlib[bcrypt]>=1.7.4",
  "ddgs>=9.6.1",
  "fonttools<4.62",
  "fpdf2>=2.8.0",
  "faster-whisper>=1.1.1",
  "google-api-python-client>=2.169.0",
  "google-auth-oauthlib>=1.2.2",
  "google-auth-httplib2>=0.2.0",
  "httpx>=0.28.1",
  "numpy>=2.2.5",
  "openpyxl>=3.1.5",
  "pdf2image>=1.17.0",
  "pdfplumber>=0.11.6",
  "Pillow>=11.2.1",
  "prompt-toolkit>=3.0.52",
  "pydantic>=2.11.4",
  "pypdf>=5.4.0",
  "pytesseract>=0.3.13",
  "python-docx>=1.1.2",
  "python-dotenv>=1.1.0",
  "python-pptx>=1.0.2",
  "playwright>=1.55.0",
  "rich>=14.0.0",
  "sounddevice>=0.5.2",
  "sentence-transformers>=4.1.0",
  "structlog>=25.3.0",
  "trafilatura>=2.0.0",
  "yfinance>=0.2.55",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.11.7",
  "pyinstaller>=6.0",
]
desktop = [
  "PySide6==6.10.2",
]
wakeword = [
  "pvporcupine>=3.0.5",
]

[project.scripts]
adv-archon = "adv_archon.main:main"
adv = "adv_archon.main:main"
adv-archon-desktop = "adv_archon.main:desktop_main"
adv-archon-api = "adv_archon.api.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adv_archon = [
  "py.typed",
  "resources/*.md",
  "resources/*.json",
  "resources/branding/*.png",
  "resources/branding/*.icns",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adv_archon"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
